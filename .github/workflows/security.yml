# Scheduled CVE scan: build every host's closure and run vulnix against it.
# Report-only by design: findings go to the job summary + artifact but do not
# fail the run (the current closure already carries known CVEs that only wait
# for a nixpkgs bump). Only real scan errors turn the run red.
# When vulnerabilities are found, the auto-update workflow is triggered so the
# inputs refresh and a fixed closure may land on main.
name: Security audit

on:
  schedule:
    - cron: "0 0,8,16 * * *" # every 8h
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: security-audit
  cancel-in-progress: false

jobs:
  vulnix:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # vulnix needs the real closure on disk, so build every host first.
      - name: Build every host
        run: |
          for host in hosts/*/; do
            host="$(basename "$host")"
            echo "building nixosConfigurations.$host"
            nix build ".#nixosConfigurations.${host}.config.system.build.toplevel" \
              --no-link --print-out-paths --accept-flake-config \
              > "$RUNNER_TEMP/out-$host"
          done

      # Exit codes: 0 = clean, 2 = vulnerabilities found (not a failure),
      # anything else = the scan itself broke.
      - name: Scan closures with vulnix
        id: scan
        run: |
          summary="$RUNNER_TEMP/vulnix-summary.md"
          report="$RUNNER_TEMP/vulnix-report.txt"
          : > "$summary"
          : > "$report"
          status=0
          vulnerable=false

          for out in "$RUNNER_TEMP"/out-*; do
            host="${out##*out-}"
            toplevel="$(cat "$out")"
            tmp="$RUNNER_TEMP/scan-$host.txt"

            echo "::group::vulnix ($host)"
            set +e
            nix run nixpkgs#vulnix -- "$toplevel" > "$tmp" 2>&1
            code=$?
            set -e

            cat "$tmp"
            echo "::endgroup::"

            {
              echo "## $host"
              echo ""
              if [ "$code" -eq 0 ]; then
                echo "✅ No known vulnerabilities."
              elif [ "$code" -eq 2 ]; then
                echo "⚠️ Vulnerabilities found (exit code 2):"
                echo ""
                echo '```'
                cat "$tmp"
                echo '```'
                echo "::warning::vulnix found vulnerabilities on $host (see job summary)"
                vulnerable=true
              else
                echo "❌ vulnix failed with exit code $code:"
                echo ""
                echo '```'
                cat "$tmp"
                echo '```'
                status=1
              fi
              echo ""
            } >> "$summary"
            cat "$tmp" >> "$report"
          done

          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          echo "vulnerable=$vulnerable" >> "$GITHUB_OUTPUT"
          exit "$status"

      # Found CVEs -> refresh the inputs so fixed versions can land on main.
      # Skipped when the scan errored (status=1, job failed before this step).
      - name: Trigger auto-update
        if: steps.scan.outputs.vulnerable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Vulnerabilities found: triggering the auto-update workflow."
          gh workflow run auto-update.yml --ref "$GITHUB_REF_NAME"
          echo "Triggered. Watch it under Actions -> Update flake inputs."

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnix-report
          path: ${{ runner.temp }}/vulnix-report.txt
          retention-days: 30
