# Daily flake.lock refresh: update inputs, build every host's toplevel,
# and only commit back to main when the build succeeds.
name: Update flake inputs

on:
  schedule:
    - cron: "33 3 * * *"
  workflow_dispatch:

permissions:
  contents: write #

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Update inputs
        run: nix flake update

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- flake.lock
          fi

      # Failures stop the job here: no commit, main stays untouched.
      - name: Build every host
        if: steps.diff.outputs.changed == 'true'
        run: |
          for host in hosts/*/; do
            host="$(basename "$host")"
            echo "building nixosConfigurations.$host"
            nix build ".#nixosConfigurations.${host}.config.system.build.toplevel" \
              --no-link --accept-flake-config
          done

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "chore: update flake.lock (auto)"
          git pull --rebase origin main
          git push
