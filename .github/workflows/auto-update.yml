# Daily flake.lock refresh: update inputs, build every host's toplevel,
# and only commit back to main when the build succeeds.
name: Update flake inputs

on:
  schedule:
    - cron: "30 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Update inputs
        run: nix flake update

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- flake.lock
          fi

      # Always build and scan
      - name: Build every host
        run: |
          : > "$RUNNER_TEMP/out-paths.txt"
          for host in hosts/*/; do
            host="$(basename "$host")"
            echo "building nixosConfigurations.$host"
            nix build ".#nixosConfigurations.${host}.config.system.build.toplevel" \
              --no-link --print-out-paths --accept-flake-config \
              >> "$RUNNER_TEMP/out-paths.txt"
          done

      # Report-only: scan the freshly built closure for CVEs. Exit codes:
      # 0 = clean, 2 = vulnerabilities found (not a failure), other = error.
      - name: Scan with vulnix
        run: |
          summary="$RUNNER_TEMP/vulnix-summary.md"
          : > "$summary"

          while IFS= read -r toplevel; do
            host="$(echo "$toplevel" | sed -E 's/.*-nixos-system-([^-]+)-.*/\1/')"
            tmp="$RUNNER_TEMP/scan-$host.txt"

            set +e
            nix run nixpkgs#vulnix -- "$toplevel" > "$tmp" 2>&1
            code=$?
            set -e

            {
              echo "## $host"
              echo ""
              if [ "$code" -eq 0 ]; then
                echo "✅ No known vulnerabilities."
              elif [ "$code" -eq 2 ]; then
                echo "⚠️ Vulnerabilities found:"
                echo ""
                echo '```'
                cat "$tmp"
                echo '```'
                echo "::warning::vulnix found vulnerabilities on $host"
              else
                echo "❌ vulnix failed (exit $code):"
                echo ""
                echo '```'
                cat "$tmp"
                echo '```'
              fi
              echo ""
            } >> "$summary"
          done < "$RUNNER_TEMP/out-paths.txt"

          cat "$summary" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "chore: update flake.lock (auto)"
          git pull --rebase origin main
          git push
