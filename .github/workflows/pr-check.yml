# PR validation only: build every host with the lock committed in the PR.
# No flake update, bump, vulnix scan or writes. No push trigger, so direct
# pushes to main are not evaluated twice.
name: Validate PR

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - name: Build all hosts
        run: |
          for host in hosts/*/; do
            host="$(basename "$host")"
            echo "building nixosConfigurations.$host"
            nix build ".#nixosConfigurations.${host}.config.system.build.toplevel" \
              --no-link --print-out-paths --accept-flake-config
          done
